<!doctype html>
<html lang="ru">
<head>
<title>Wear It Again</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2eb;--ink:#161513;--mut:#8a857d;--line:#e5dfd4;--card:#ece8e1;--sand:#8b6b45}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
#app{max-width:960px;margin:auto;min-height:100vh;padding:0 20px 120px}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 0}
.logo{font:600 11px Inter;letter-spacing:5px;text-transform:uppercase;cursor:pointer}
.ib{border:1px solid var(--ink);background:none;border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer}
h1{font:500 clamp(44px,9vw,76px)/.98 'Cormorant Garamond',serif;margin:14px 0}h1 em{color:var(--sand)}
h2{font:500 30px 'Cormorant Garamond',serif}h3{font:600 15px Inter}
.sub{color:var(--mut);font-size:14px;line-height:1.6;margin:6px 0 18px;max-width:560px}
.view{animation:in .45s ease}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1}}
.btn{padding:15px 22px;border-radius:14px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:500 14px Inter;cursor:pointer;transition:.2s;width:100%;margin-bottom:10px}
.btn:active{transform:scale(.98)}.btn.alt{background:transparent;color:var(--ink)}.btn.dng{background:none;color:#a33;border-color:#d9b4b4}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.sec{margin:34px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:.25s;border:2px solid transparent}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:4/5;object-fit:contain;display:block;padding:8px}
.card .cap{padding:8px 12px 12px;font-size:13px;font-weight:500}.cap small{display:block;color:var(--mut);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;margin-top:3px;font-weight:400}
.heart{position:absolute;top:6px;right:6px;border:none;background:rgba(255,255,255,.85);border-radius:50%;width:30px;height:30px;font-size:15px;cursor:pointer;color:#bbb}.heart.on{color:#b3392f}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 15px;border-radius:20px;border:1px solid var(--line);background:#fff;font:500 12px Inter;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:14px Inter;margin-bottom:10px}
label{font:500 11px Inter;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);display:block;margin:4px 0 6px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.box{background:#fff;border-radius:16px;padding:20px;margin:12px 0}.box p{font-size:13.5px;line-height:1.6;color:#444;margin-top:8px}
.look-header {display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.look-heading {display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px}
.look-modes {display:flex;gap:4px;background:#eae4da;padding:4px;border-radius:12px}
.look-modes button,.look-action,.look-icon {font:600 13px Inter,sans-serif;cursor:pointer;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink);min-height:40px;padding:7px 11px}
.look-modes button[aria-pressed=true] {background:#fff;box-shadow:0 1px 4px #25190c1a}
.look-controls {display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) auto;gap:8px;margin-bottom:12px;align-items:end}
.look-controls select {margin:0;padding:9px;min-height:42px;color:var(--ink)}
.look-action {border-color:var(--line);background:#fff;min-height:42px}
.look-action.primary {background:var(--look-accent);color:#fff;border-color:var(--look-accent)}
.look-rows {border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
.look-row {padding:10px 12px;touch-action:pan-y}
.look-row + .look-row {border-top:1px solid var(--line)}
.look-row-header {display:flex;align-items:center;justify-content:space-between;gap:8px}
.look-row-header h3 {font-size:13px}
.look-tools {display:flex;gap:4px}
.look-icon {min-width:42px;font-size:20px;padding:4px;color:var(--look-accent)}
.look-icon[aria-pressed=true] {background:#eee4db;color:#523625}
.look-icon:disabled {opacity:.3;cursor:default}
.look-carousel {display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.5fr) minmax(0,1fr);gap:8px;align-items:center}
.look-piece {font:500 12px/1.35 Inter,sans-serif;display:grid;place-items:center;gap:5px;min-width:0;width:100%;padding:5px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;overflow:hidden}
.look-piece img {width:100%;height:clamp(96px,31vw,168px);object-fit:contain;pointer-events:none}
.look-piece.side {color:#6f655a;background:#f8f6f3}
.look-piece.side img {height:clamp(58px,19vw,90px)}
.look-piece span {max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.look-piece .look-plus {font-size:25px;color:var(--look-accent)}
.look-piece.empty-piece {min-height:90px;border:1px dashed var(--line)}
.outfit,.look-preview {--look-accent:#6f5340}
.look-board {
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(8px,2vw,18px);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);
  --head-row:clamp(65px,16vw,110px);--body-row:clamp(104px,26vw,190px);--foot-row:clamp(80px,20vw,136px);
  grid-template-rows:var(--head-row) repeat(2,var(--body-row)) var(--foot-row);
  grid-template-areas:". hat extra" "coat top bag" "coat bottom dress" "socks shoes other";
  gap:clamp(4px,1vw,10px);align-items:center;
}
.look-board.no-separates {grid-template-areas:". hat extra" "coat dress bag" "coat dress ." "socks shoes other"}
.look-board.no-head-row {grid-template-areas:"coat top bag" "coat bottom dress" "socks shoes other";grid-template-rows:repeat(2,var(--body-row)) var(--foot-row)}
.look-board.no-separates.no-head-row {grid-template-areas:"coat dress bag" "coat dress ." "socks shoes other"}
.look-board.with-belt:not(.no-separates) {
  --belt-row:clamp(48px,12vw,70px);
  grid-template-areas:". hat extra" "coat top bag" "coat belt bag" "coat bottom dress" "socks shoes other";
  grid-template-rows:var(--head-row) var(--body-row) var(--belt-row) var(--body-row) var(--foot-row);
}
.look-board.with-belt.no-head-row:not(.no-separates) {
  grid-template-areas:"coat top bag" "coat belt bag" "coat bottom dress" "socks shoes other";
  grid-template-rows:var(--body-row) var(--belt-row) var(--body-row) var(--foot-row);
}
.look-board.with-belt.no-separates {grid-template-areas:". hat extra" "coat dress bag" "coat dress belt" "socks shoes other"}
.look-board.with-belt.no-separates.no-head-row {grid-template-areas:"coat dress bag" "coat dress belt" "socks shoes other"}
.look-board.empty-board {display:block}
.look-cell {position:relative;display:flex;align-items:stretch;min-width:0;height:100%}
.look-cell[data-category=Outerwear] {grid-area:coat;height:66%}
.look-cell[data-category=Tops] {grid-area:top}
.look-cell[data-category=Bottoms] {grid-area:bottom}
.look-cell[data-category=Shoes] {grid-area:shoes}
.look-cell[data-category=Headwear] {grid-area:hat}
.look-cell[data-category=Accessories] {grid-area:extra}
.look-cell[data-category=Socks] {grid-area:socks}
.look-cell[data-category=Bags] {grid-area:bag}
.look-cell[data-category=Belts] {grid-area:belt}
.look-cell[data-category=Other] {grid-area:other}
.look-cell[data-category=Dresses] {grid-area:dress}
.look-cell .look-piece {height:100%;min-height:0;grid-template-rows:minmax(0,1fr) auto;padding:4px}
.look-cell .look-piece img {height:100%;min-height:0;display:block}
.look-cell .look-piece.empty-piece {border-color:transparent}
.look-piece:focus-visible {outline:2px solid #6f5340;outline-offset:-2px}
.look-cell .look-piece:not(button) {cursor:default}
.look-cell .look-piece span {font-size:clamp(9px,2.4vw,12px);max-width:100%}
.look-cell .look-tools {position:absolute;top:0;right:0;z-index:1;gap:2px}
.look-cell .look-tools button {display:grid;place-items:center;min-width:34px;min-height:34px;background:#fffefc;border:1px solid #eee9e3;border-radius:50%;font-size:17px}
.look-cell .look-tools button[aria-pressed=true] {background:#eee4db}
.look-placeholder {position:relative;display:grid;place-items:center;width:100%;height:100%;max-width:145px}
.look-silhouette {display:block;width:88%;height:80%;background:#e8e3dc}
/* The empty slots use contours traced from the catalog references. */
[data-category=Tops] .look-silhouette {clip-path:polygon(42% 5%,58% 5%,65% 10%,73% 20%,83% 24%,89% 35%,97% 85%,97% 96%,81% 96%,76% 70%,74% 92%,26% 92%,24% 70%,19% 96%,3% 96%,3% 85%,11% 35%,17% 24%,27% 20%,35% 10%)}
[data-category=Outerwear] .look-silhouette {clip-path:polygon(31% 11%,40% 6%,50% 4%,61% 6%,71% 12%,76% 20%,77% 28%,87% 37%,93% 50%,98% 69%,99% 91%,96% 96%,82% 97%,77% 94%,73% 97%,27% 97%,23% 94%,18% 97%,4% 96%,1% 91%,2% 69%,7% 50%,13% 37%,23% 28%,24% 20%)}
[data-category=Bottoms] .look-silhouette {clip-path:polygon(23% 4%,38% 6%,51% 8%,63% 7%,77% 4%,81% 23%,91% 59%,93% 87%,90% 94%,83% 98%,58% 97%,54% 91%,50% 45%,45% 77%,44% 91%,41% 97%,16% 98%,8% 93%,7% 86%,9% 54%,16% 24%)}
/* Overlapping sneakers, with a separate sole on each silhouette. */
[data-category=Shoes] .look-silhouette {
  position:relative;width:96%;height:72%;max-height:82px;background:none;
  --sneaker:polygon(2% 66%,5% 48%,10% 31%,19% 29%,27% 38%,34% 35%,42% 17%,52% 13%,62% 20%,69% 33%,80% 44%,93% 53%,99% 65%,99% 76%,95% 85%,84% 90%,67% 91%,50% 88%,36% 80%,23% 80%,11% 75%,3% 72%);
}
[data-category=Shoes] .look-silhouette::before,
[data-category=Shoes] .look-silhouette::after {
  position:absolute;content:"";width:75%;height:77%;clip-path:var(--sneaker);
}
[data-category=Shoes] .look-silhouette::before {right:0;top:0;background:linear-gradient(#d4ccc2 71%,#bcb1a5 72%)}
[data-category=Shoes] .look-silhouette::after {left:0;bottom:0;background:linear-gradient(#e4dcd3 71%,#c5b8ab 72%)}
[data-category=Headwear] .look-silhouette {height:68%;clip-path:polygon(23% 57%,27% 39%,33% 25%,45% 15%,63% 10%,67% 7%,73% 9%,76% 13%,87% 19%,94% 29%,99% 46%,99% 62%,96% 74%,76% 72%,67% 80%,53% 88%,43% 91%,34% 88%,13% 80%,5% 82%,1% 79%,2% 74%,10% 66%)}
[data-category=Socks] .look-silhouette {clip-path:polygon(11% 9%,34% 9%,34% 4%,64% 4%,64% 48%,67% 58%,76% 67%,91% 82%,94% 88%,91% 94%,84% 97%,76% 96%,70% 93%,63% 98%,54% 99%,46% 96%,35% 85%,25% 75%,14% 69%,7% 61%,7% 54%,11% 46%)}
[data-category=Bags] .look-silhouette {clip-path:polygon(11% 65%,20% 59%,31% 30%,39% 12%,45% 5%,50% 3%,55% 5%,61% 12%,69% 30%,80% 59%,89% 65%,95% 80%,94% 91%,88% 97%,11% 97%,5% 91%,5% 81%,11% 65%,25% 65%,43% 69%,58% 69%,75% 65%,77% 59%,67% 32%,60% 16%,54% 8%,50% 7%,46% 8%,40% 16%,33% 32%,22% 60%,25% 65%)}
[data-category=Accessories] .look-silhouette {clip-path:polygon(12% 17%,6% 27%,9% 42%,21% 57%,40% 69%,49% 71%,60% 69%,80% 56%,91% 42%,94% 28%,88% 17%,98% 25%,99% 36%,94% 50%,81% 66%,64% 78%,55% 82%,55% 86%,66% 88%,58% 93%,60% 100%,50% 96%,40% 100%,42% 93%,34% 88%,45% 86%,45% 82%,34% 77%,18% 66%,5% 50%,1% 36%,2% 25%)}
/* Off-shoulder neckline, separate long sleeves and a full skirt. */
[data-category=Dresses] .look-silhouette {
  width:88%;height:91%;max-width:132px;
  background:linear-gradient(#d3c8bd 0 15%,#e8e0d7 16% 47%,#e0d6ca 49% 100%);
  clip-path:polygon(17% 7%,23% 5%,41% 4%,60% 4%,78% 5%,84% 7%,85% 16%,87% 35%,91% 53%,99% 82%,94% 85%,89% 85%,85% 69%,80% 53%,75% 30%,71% 25%,72% 36%,68% 49%,77% 58%,85% 75%,88% 91%,84% 95%,76% 97%,65% 98%,53% 99%,40% 98%,29% 97%,18% 95%,13% 91%,16% 75%,23% 59%,33% 49%,29% 37%,30% 26%,25% 31%,21% 53%,15% 70%,10% 85%,5% 84%,0% 81%,9% 53%,13% 34%,16% 16%);
}
[data-category=Other] .look-silhouette {width:60%;height:54%;clip-path:polygon(26% 9%,74% 9%,91% 26%,91% 74%,74% 91%,26% 91%,9% 74%,9% 26%)}
/* Rolled strap and a square buckle inspired by the belt reference. */
[data-category=Belts] .look-silhouette {position:relative;width:82%;height:53%;max-height:46px;border-radius:48% 48% 38% 38%;background:#dfd5ca;box-shadow:inset 0 -5px #cbbdad}
[data-category=Belts] .look-silhouette::before {content:"";position:absolute;left:7%;right:7%;top:7%;height:36%;border-radius:50%;background:#fff}
[data-category=Belts] .look-silhouette::after {content:"";position:absolute;left:38%;bottom:-6%;width:23%;height:49%;border:2px solid #a68d75;border-radius:3px;background:#dfd5ca}
.look-cell .look-placeholder .look-plus {position:absolute;right:4%;bottom:8%;display:grid;place-items:center;width:32px;height:32px;background:#fff;border:1px solid #ded6cc;border-radius:50%;font-size:23px}
.look-review {display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.look-review button {flex:1}
.look-preview label:first-of-type {margin-top:16px}
.look-preview .look-board {--head-row:clamp(48px,12vw,80px);--body-row:clamp(80px,22vw,142px);--foot-row:clamp(64px,17vw,110px)}
.look-preview .row {margin-top:8px}
.look-row .look-empty {padding:5px 0}
.look-add-row {margin:12px 0 16px}
.look-form {padding-top:12px;border-top:1px solid var(--line)}
.look-picker-head {display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.look-picker-items .look-piece {border-color:var(--line);background:#fff}
.look-picker-items .look-piece[aria-pressed=true] {outline:2px solid #6f5340;outline-offset:-2px}
.look-picker-items .look-piece img {height:76px}
.look-picker-actions {display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.look-empty {padding:16px;color:#635b52;font-size:13px}
@media(max-width:540px) {
  .look-cell .look-tools button {min-width:32px;min-height:32px}
  .look-controls {grid-template-columns:repeat(2,minmax(0,1fr))}
  .look-controls .look-action {grid-column:1/-1}
  .look-row {padding:8px}
  .look-piece {font-size:11px}
}
.oc{background:#fff;border-radius:18px;padding:12px}.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}.strip img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--card);border-radius:8px}
.oc b{font:500 22px 'Cormorant Garamond',serif}.oc small{display:block;color:var(--mut);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:3px 0 10px}
.mini{display:flex;gap:6px;flex-wrap:wrap}.mini button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:#fff;font:500 11px Inter;cursor:pointer}
.up{border:1.5px dashed var(--mut);border-radius:22px;padding:44px 20px;text-align:center;background:#fff}.up h2{margin-bottom:18px}.up .photo-tip{max-width:420px;margin:0 auto 18px;line-height:1.55}
.prev{background:var(--card);border-radius:18px;padding:10px;text-align:center}.prev img{max-width:100%;max-height:380px;object-fit:contain}
.spin{width:34px;height:34px;border:3px solid #ddd;border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;margin:30px auto 12px}@keyframes sp{to{transform:rotate(360deg)}}
.err{background:#f8e9e7;color:#8a2c22;border-radius:12px;padding:12px 14px;font-size:13px;margin:12px 0}
.stats2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:#fff;border-radius:14px;padding:16px}.stat b{font:500 40px 'Cormorant Garamond',serif;display:block}.stat span{font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:12.5px}.bar .n{width:96px}.bar .t{flex:1;height:6px;background:#eee;border-radius:4px}.bar u{display:block;height:6px;background:var(--ink);border-radius:4px}.bar .v{width:26px;text-align:right;color:var(--mut)}
.photo{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:var(--card);display:block}
.empty{text-align:center;padding:50px 10px}.empty svg{width:70px;stroke:var(--mut);fill:none;stroke-width:1.2;margin-bottom:10px}
.tag{font:italic 500 22px 'Cormorant Garamond',serif;text-align:center;margin:30px 0;color:var(--sand)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);display:flex;align-items:flex-end;padding:10px 4px calc(14px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.07);z-index:5}
nav button{flex:1;border:none;background:none;font:500 10px Inter;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}nav button.on{color:var(--ink)}nav button span{font-size:19px}
nav .mid span{width:54px;height:54px;border-radius:50%;background:var(--sand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-34px;border:5px solid var(--bg)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}.sheet.on{display:flex}
#sb{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:22px 20px 30px;max-height:92vh;overflow:auto;animation:in .3s}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;z-index:20;display:none}
.menu button{display:block;width:100%;text-align:left;padding:15px 4px;border:none;border-bottom:1px solid var(--line);background:none;font:500 22px 'Cormorant Garamond',serif;cursor:pointer}
.fl{border:2px solid transparent;border-radius:6px;padding:0;background:none;cursor:pointer;opacity:.45;transition:.2s;line-height:0;outline:1px solid var(--line)}.fl.on{opacity:1;border-color:var(--ink)}.fl svg{width:32px;height:22px;border-radius:3px}
.scroll-frame {display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:center;gap:4px}
.scroll-frame[data-overflow=false] {grid-template-columns:minmax(0,1fr)}
.scroll-frame[data-overflow=false] > .list-arrow {display:none}
.scroll-frame > .chips,.scroll-frame > .look-picker-items {min-width:0}
.list-arrow {display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;background:#fff;color:var(--ink);font:600 22px/1 Inter,sans-serif;cursor:pointer}
.list-arrow[aria-disabled=true] {opacity:.35;cursor:default}
.look-stepper {display:grid;grid-template-columns:40px minmax(0,1fr) 40px;justify-items:center;align-items:center;gap:8px;max-width:200px;margin:8px auto 0;color:#685f56;font-size:12px}
.look-stepper .list-arrow {width:40px;height:40px}
.look-carousel .look-piece[aria-pressed=true] {border-color:#bdab9a;background:#faf7f3}
.look-carousel .look-piece.center {min-height:64px}
.look-picker-items {display:flex;overflow-x:auto;scrollbar-width:none;gap:8px;margin:12px 0;padding:3px}
.look-picker-items .look-piece {flex:0 0 clamp(82px,25%,112px)}
.inspo-heading {display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.inspo-filter-button {display:inline-flex;align-items:center;gap:8px;padding:8px 12px;min-height:42px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:600 13px Inter,sans-serif;cursor:pointer}
.inspo-filter-icon {width:19px;height:14px;display:inline-block;background:linear-gradient(currentColor 0 0) 0 0/100% 2px,linear-gradient(currentColor 0 0) 0 6px/72% 2px,linear-gradient(currentColor 0 0) 0 12px/44% 2px;background-repeat:no-repeat;color:#6f5340}
.inspo-filter-count {display:grid;place-items:center;min-width:21px;height:21px;padding:0 4px;border-radius:50%;background:#eee4db;color:#523625;font-size:11px}
.inspo-selection {margin:-4px 0 14px;color:#6f5340;font-size:13px}
.inspo-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,145px),1fr));gap:12px}

const tr=x=>lang=='ru'&&RU[x]||x;
const escapeAttr = value => escapeText(value).replace(/"/g, '&quot;');
const escapeText = value => String(value).replace(/[&<>]/g, char => ({'&':'&amp;', '<':'&lt;', '>':'&gt;'}[char]));
function applyLang(){document.querySelectorAll('.fl').forEach(b=>b.classList.toggle('on',b.dataset.v==lang));if(lang!='ru')return;
document.querySelectorAll('#view,#nav,#sb,#toast').forEach(r=>{const w=document.createTreeWalker(r,4);let n;while(n=w.nextNode()){const o=n.nodeValue,k=o.trim();if(!k)continue;const v=k.includes(' · ')?k.split(' · ').map(tr).join(' · '):tr(k);if(v!=k)n.nodeValue=o.replace(k,v)}});
document.querySelectorAll('[placeholder]').forEach(e=>e.placeholder=tr(e.getAttribute('placeholder')))}
/* ---------- storage (IndexedDB) ---------- */
const db=new Promise((ok,no)=>{const r=indexedDB.open('wia',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kvGet=k=>db.then(d=>new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)}));
const kvSet=(k,v)=>db.then(d=>new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)}));
const save=()=>Promise.all([kvSet('items',D.items),kvSet('outfits',D.outfits),kvSet('likes',D.likes)]).catch(()=>toast('Could not save data. Browser storage may be blocked.'));
const toast=m=>{const t=$('#toast');t.textContent=tr(m);t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)};

const INSPIRATION = Object.entries(INSPIRATION_COLLECTIONS).flatMap(([category, rows], groupIndex) =>
  rows.trim().split('\n').map((row, index) => {
    const [name, photoKey, occasion, season, style, cropArea] = row.split('|');
    return {
      id: category === 'Outfit inspiration' ? 'home-look-' + (index + 1) : category + (index + 1),
      name, category,
      photo: INSPIRATION_PHOTOS[photoKey],
      cropArea: cropArea?.split(',').map(Number),
      seed: groupIndex * 10 + index,
      occasion: occasion.split('/'),
      season: season.split('/'),
      style: style.split('/')
    };
  })
);
const INSPIRATION_FILTERS = {
  occasion:{name:'Occasion', values:['Everyday','Work','Date','Formal','Travel','At home','Party','Sport','Special occasion','School','Beach','Other']},
  season:{name:'Season', values:SEAS.filter(season=>season!=='All seasons')},
  style:{name:'Style', values:['Casual','Business casual','Formal','Modern','Classic','Minimalist','Bohemian','Luxe','Sporty','Athleisure','Trendy','Kidcore','Artistic','Dressy','Feminine','Street style','Comfortable']}
};
const blankInspirationFilters = () => ({occasion:[],season:[],style:[]});
let inspirationFilters = blankInspirationFilters();
let filterDraft = blankInspirationFilters();
let inspirationFavouritesOnly = false;
let inspirationCollection = 'All';
let inspirationDetailId = '';
let inspirationReturn = {page:'inspo',y:0};

function filteredInspiration() {
  return INSPIRATION.filter(outfit=>(!inspirationFavouritesOnly || D.likes.includes(outfit.id)) &&
    (inspirationCollection==='All' || outfit.category===inspirationCollection) &&
    Object.entries(inspirationFilters).every(([key, selected])=>
      !selected.length || selected.some(value=>outfit[key].includes(value))));
}

const INSPIRATION_PALETTES = [
  ['#eee0cd','#7b8883','#3c4745'],['#beaa99','#646d83','#978579'],
  ['#c6b1a7','#8b7660','#363b45'],['#d9c7ad','#677563','#79645d'],
  ['#b0b9c5','#434d63','#a89282'],['#d8b9a5','#8b6a70','#50494b']
];

function inspirationPicture(outfit, eager) {
  const name = escapeAttr(outfit.name);
  const url = escapeAttr(outfit.photo);
  const ready = "this.closest('.inspo-media').classList.add('photo-ready')";
  if (!outfit.cropArea) {
    return `<img class="inspo-photo" src="${url}" alt="${name}" loading="${eager?'eager':'lazy'}"
      decoding="async" onload="${ready}" onerror="this.hidden=true">`;
  }
  const [left, top, right, bottom, width, height] = outfit.cropArea;
  const cropWidth = right-left;
  const cropHeight = bottom-top;
  return `<svg class="inspo-photo" viewBox="0 0 ${cropWidth} ${cropHeight}" role="img" aria-label="${name}">
    <svg width="${cropWidth}" height="${cropHeight}" overflow="hidden">
      <image href="${url}" x="${-left}" y="${-top}" width="${width}" height="${height}" preserveAspectRatio="none"
        onload="${ready}" onerror="this.closest('.inspo-photo').setAttribute('hidden','')"/>
    </svg>
  </svg>`;
}

function inspirationMedia(outfit, extra = '') {
  const [top,bottom,shoe] = INSPIRATION_PALETTES[outfit.seed % INSPIRATION_PALETTES.length];
  return `<span class="inspo-media ${extra}">
    <span class="inspo-placeholder" aria-hidden="true">
      <span data-category="Tops"><span class="look-silhouette" style="background:${top}"></span></span>
      <span data-category="Bottoms"><span class="look-silhouette" style="background:${bottom}"></span></span>
      <span data-category="Shoes" style="--inspo-shoe:${shoe}"><span class="look-silhouette"></span></span>
    </span>
    ${inspirationPicture(outfit, Boolean(extra))}
  </span>`;
}

function inspirationCard(outfit) {
  const id = escapeAttr(outfit.id);
  const saved = D.likes.includes(outfit.id);
  return `<article class="inspo-card">
    <button type="button" class="inspo-open" data-act="openinspo" data-id="${id}" aria-label="${escapeAttr(tr('Open') + ': ' + tr(outfit.name) + ', ' + tr(outfit.style[0]))}">
      ${inspirationMedia(outfit)}
      <span class="inspo-caption"><b>${escapeText(outfit.name)}</b><small>${tr(outfit.style[0])} · ${tr(outfit.season[0])}</small></span>
    </button>
    <button type="button" class="heart${saved?' on':''}" data-act="like" data-id="${id}" aria-label="${tr('Favourite this look')}" title="${tr('Favourite this look')}" aria-pressed="${saved}">♥</button>
  </article>`;
}

function inspirationDetailPage() {
  const outfit = INSPIRATION.find(entry=>entry.id===inspirationDetailId);
  if (!outfit) return inspirationPage();
  const saved = D.likes.includes(outfit.id);
  const tags = Object.entries(INSPIRATION_FILTERS).map(([key, filter])=>
    `<div><dt>${tr(filter.name)}</dt><dd>${outfit[key].map(tr).join(' · ')}</dd></div>`).join('');
  return `<article class="inspo-detail">
    <button type="button" class="look-action" data-act="backinspo">‹ <span>Back</span></button>

    <dl class="inspo-tags">${tags}</dl>
    <button type="button" class="btn alt inspo-save" data-act="like" data-id="${escapeAttr(outfit.id)}" aria-pressed="${saved}">${tr(saved?'In favourites':'Add to favourites')}</button>

}

function openInspirationDetail(id) {
  if (!INSPIRATION.some(outfit=>outfit.id===id)) return;
  inspirationReturn = {page:page==='home'?'home':'inspo', y:globalThis.scrollY || 0};
  inspirationDetailId = id;

  $('.inspo-detail-heading')?.focus({preventScroll:true});
}

function backFromInspirationDetail() {
  const id = inspirationDetailId;
  go(inspirationReturn.page);
  scrollTo(0,inspirationReturn.y);
  Array.from(document.querySelectorAll('[data-act="openinspo"]')).find(button=>button.dataset.id===id)?.focus({preventScroll:true});
}

function toggleInspirationFavourite(id, button) {
  if (!INSPIRATION.some(outfit=>outfit.id===id)) return;
  const saved = !D.likes.includes(id);
  D.likes = saved ? [...D.likes,id] : D.likes.filter(value=>value!==id);
  kvSet('likes',D.likes).catch(()=>toast('Could not save data. Browser storage may be blocked.'));

    render();$('[data-act="inspofavs"][data-v="only"]')?.focus({preventScroll:true});

function inspirationPage() {
  const outfits = filteredInspiration();

/* ---------- outfit builder ---------- */
const LOOK_CATS = CATS;
const START_CATS = ['Tops', 'Bottoms', 'Socks', 'Shoes'];
const look = { mode: 'carousel', source: 'All clothes', season: 'Any season' };
let pendingLookUpload = '';
const newDraft = () => ({
  slots: {}, categories: [...START_CATS], pins: [],
  occ: 'Everyday', name: '', id: null
});
let dr = newDraft();
let outfitSaving = false;
let itemSaving = false;

function lookItems(category) {
  return D.items.filter(item => item.cat === category &&
    (look.source !== 'Favourites' || item.fav) &&
    (look.season === 'Any season' || item.season === 'All seasons' || item.season === look.season));
}

function lookPiece(item, category, action = 'put', extra = '') {
  const selected = action === 'put' ? ` aria-pressed="${item.id == dr.slots[category]}"` : '';
  return `<button type="button" class="look-piece ${extra}" data-act="${action}" data-c="${category}" data-id="${item.id}"${selected}>
    <img src="${escapeAttr(item.img)}" alt="" draggable="false">
    <span>${escapeText(item.name)}</span>
  </button>`;
}

function categoryHeader(category, item) {
  const pinned = dr.pins.includes(category);
  return `<div class="look-row-header"><h3>${tr(category)}</h3><div class="look-tools">
    <button type="button" class="look-icon" data-act="pinlook" data-c="${category}" aria-label="${tr('Pin for shuffle')}" title="${tr('Pin for shuffle')}" aria-pressed="${pinned}" ${item?'':'disabled'}>⌖</button>
    <button type="button" class="look-icon" data-act="unslot" data-c="${category}" aria-label="${tr('Remove from outfit')}" title="${tr('Remove from outfit')}" ${item?'':'disabled'}>×</button>
  </div></div>`;
}

function cycleCandidate(items, item, direction) {
  if (!items.length) return undefined;
  const index = items.findIndex(candidate => candidate.id === item?.id);
  return index === -1 ? items[direction < 0 ? items.length - 1 : 0]
    : items[(index + direction + items.length) % items.length];
}

function wardrobeCategories() {
  const inWardrobe = new Set(D.items.map(item=>item.cat));
  return LOOK_CATS.filter(category=>inWardrobe.has(category));
}

function rowFrame(category) {
  const choices = lookItems(category);
  const selected = it(dr.slots[category]);
  const item = choices.find(piece=>piece.id===selected?.id) || choices[0];
  return {choices, selected, item};
}

function drawLookRow(category) {
  const {choices, selected, item} = rowFrame(category);
  const prev = cycleCandidate(choices, item, -1);
  const next = cycleCandidate(choices, item, 1);
  const index = choices.indexOf(item);
  const outsideFilters = selected && selected.id !== item?.id;
  const button = (act, label, symbol) => `<button type="button" class="list-arrow" data-act="${act}" data-c="${category}" aria-label="${tr(label)}">${symbol}</button>`;
  return `<section class="look-row" data-look-row="${category}">
    ${categoryHeader(category, selected)}
    ${item ? `<div class="look-carousel">
      ${prev && prev.id !== item.id ? lookPiece(prev, category, 'cycleprev', 'side') : '<span></span>'}
      ${lookPiece(item, category, 'put', 'center')}
      ${next && next.id !== item.id && next.id !== prev?.id ? lookPiece(next, category, 'cyclenext', 'side') : '<span></span>'}
    </div>
    ${choices.length>1 ? `<div class="look-stepper">
      ${button('lookback','Previous item','‹')}
      <span aria-live="polite">${index+1} / ${choices.length}</span>
      ${button('lookforward','Next item','›')}
    </div>` : ''}` : ''}
    ${outsideFilters || !item ? `<p class="look-empty">${tr(outsideFilters ? 'Outside current filters' : 'No items match these filters.')}</p>` : ''}
  </section>`;
}

function renderCollage(draft, editable = false) {
  const categories = editable ? draft.categories : draft.categories.filter(c=>it(draft.slots[c]));
  if (!categories.length) {
    return `<div class="look-board empty-board"><p class="look-empty">${tr(editable ? 'Add a category to get started.' : 'Nothing here yet')}</p></div>`;
  }

  const dressFocus = categories.includes('Dresses') && !categories.some(c=>c==='Tops'||c==='Bottoms');
  const hasHeadRow = categories.some(c=>c==='Headwear'||c==='Accessories');
  return `<div class="look-board${dressFocus?' no-separates':''}${hasHeadRow?'':' no-head-row'}${categories.includes('Belts')?' with-belt':''}">${categories.map(category => {
    const item = it(draft.slots[category]);
    const name = item ? escapeText(item.name) : tr(category);
    const picture = item
      ? `<img src="${escapeAttr(item.img)}" alt="" draggable="false">`
      : '<span class="look-placeholder" aria-hidden="true"><span class="look-silhouette"></span><span class="look-plus">+</span></span>';
    const inner = `${picture}<span>${name}</span>`;
    const tools = editable ? `<div class="look-tools">
      ${item?`<button type="button" class="look-icon" data-act="pinlook" data-c="${category}" aria-label="${tr('Pin for shuffle')}" aria-pressed="${draft.pins.includes(category)}">⌖</button>`:''}
      <button type="button" class="look-icon" data-act="removecat" data-c="${category}" aria-label="${tr('Remove category from canvas')}: ${tr(category)}" title="${tr('Remove category from canvas')}">×</button>
    </div>` : '';
    return `<section class="look-cell" data-category="${category}">${tools}
      ${editable
        ? `<button type="button" class="look-piece${item?'':' empty-piece'}" data-act="pick" data-c="${category}" aria-label="${escapeAttr(tr(category) + ': ' + (item ? item.name : tr('Choose a piece')))}">${inner}</button>`
        : `<div class="look-piece">${inner}</div>`}
    </section>`;
  }).join('')}</div>`;
}

function openLookPreview() {
  sheet(`<section class="look-preview">
    <div class="look-picker-head"><h2>Outfit preview</h2><button type="button" class="look-icon" data-act="closesheet" aria-label="${tr('Close')}">×</button></div>
    ${renderCollage(dr)}
    <label for="o_n">Outfit name</label><input id="o_n" placeholder="Casual Monday" value="${escapeAttr(dr.name)}">
    <label for="o_occ">Occasion</label>${sel('o_occ',OCC,dr.occ)}
    <div class="row"><button type="button" class="btn" data-act="saveo">Save Outfit</button><button type="button" class="btn alt" data-act="closesheet">Back to outfit</button></div>
  </section>`);
  $('#sb button')?.focus();
}

function builder() {
  const categories = wardrobeCategories();
  return `<section class="outfit">
    <div class="look-header"><div class="look-heading"><h2>Create an Outfit</h2><button type="button" class="look-action primary" data-act="previewlook">Next</button></div><div class="look-modes" role="group" aria-label="${tr('Outfit view')}">
      <button type="button" data-act="lookmode" data-v="carousel" aria-pressed="${look.mode==='carousel'}">Carousel</button>
      <button type="button" data-act="lookmode" data-v="board" aria-pressed="${look.mode==='board'}">White canvas</button>
    </div></div>
    <div class="look-controls">
      <div><label for="look-source">Clothes</label>${sel('look-source', ['All clothes','Favourites'], look.source)}</div>
      <div><label for="look-season">Season</label>${sel('look-season', ['Any season', ...SEAS.filter(s=>s!=='All seasons')], look.season)}</div>
      <button type="button" class="look-action primary" data-act="surprise">Shuffle</button>
    </div>
    <p class="sub">${look.mode==='carousel'?'Swipe a row or use the arrows.':'Tap + to pick a piece for your outfit.'}</p>
    ${look.mode==='board' ? renderCollage(dr, true) : `<div class="look-rows">
      ${categories.length ? categories.map(drawLookRow).join('') : `<p class="look-empty">${tr('Your wardrobe is empty.')}</p>`}
    </div>`}
    ${look.mode==='board' && dr.categories.length < LOOK_CATS.length ? '<div class="look-add-row"><button type="button" class="look-action" data-act="addlookcat">Add category</button></div>' : ''}
    <div class="look-review">
      <button type="button" class="look-action primary" data-act="saveo">Save Outfit</button>
      <button type="button" class="look-action" data-act="clear">Clear All</button>
    </div>
  </section>`;
}

function openLookPicker(category) {
  const choices = lookItems(category);
  const current = it(dr.slots[category]);
  const hasPieces = D.items.some(item=>item.cat===category);
  sheet(`<div class="look-picker-head"><h2>${tr(category)}</h2><button type="button" class="look-icon" data-act="closesheet" aria-label="${tr('Close')}">×</button></div>
    ${choices.length ? `<div class="look-picker-items">${choices.map(item=>lookPiece(item,category,'put')).join('')}</div>` : `<p class="look-empty">${hasPieces?'No items match these filters.':'Nothing in this category yet.'}</p>`}
    <div class="look-picker-actions">
      ${!choices.length && hasPieces ? `<button type="button" class="look-action" data-act="resetlookfilters" data-c="${category}">Show all clothes</button>` : ''}
      <button type="button" class="look-action" data-act="uploadlook" data-c="${category}">Upload a new piece</button>
      ${current ? `<button type="button" class="look-action" data-act="unslot" data-c="${category}">Remove from outfit</button>` : ''}
    </div>`);
  $('#sb button')?.focus();
}

function refreshLook(action, category) {
  render();
  document.querySelector(`[data-act="${action}"]${category ? `[data-c="${category}"]` : ''}`)?.focus({preventScroll:true});
}

function selectLookPiece(category, item, focusAction = look.mode==='carousel'?'put':'pick') {
  if (!item || item.cat !== category || !LOOK_CATS.includes(category)) return;
  if (!dr.categories.includes(category)) dr.categories.push(category);
  if (dr.slots[category] != item.id) removeLookPiece(category);
  dr.slots[category] = item.id;
  sheet();
  refreshLook(focusAction, category);
}

function cycleLook(category, direction, focusAction) {
  const {choices, item} = rowFrame(category);
  if (choices.length < 2) return;
  selectLookPiece(category, cycleCandidate(choices, item, direction), focusAction);
}

function removeLookPiece(category) {
  delete dr.slots[category];
  dr.pins = dr.pins.filter(c=>c !== category);
}

function shuffleLook() {
  let available = false;
  const categories = look.mode==='carousel' ? wardrobeCategories() : dr.categories;
  for (const category of categories) {
    if (dr.pins.includes(category) && it(dr.slots[category])) continue;
    const candidates = lookItems(category);
    if (!candidates.length) continue;
    const alternatives = candidates.filter(item=>item.id != dr.slots[category]);
    const pool = alternatives.length ? alternatives : candidates;
    if (!dr.categories.includes(category)) dr.categories.push(category);
    dr.slots[category] = pool[Math.floor(Math.random()*pool.length)].id;
    available = true;
  }
  if (available) refreshLook('surprise');
  else toast('No available pieces to shuffle.');
}

function draftFor(outfit) {
  const slots = Object.fromEntries(LOOK_CATS.filter(c=>it(outfit.slots?.[c])?.cat===c).map(c=>[c,outfit.slots[c]]));
  const categories = Array.isArray(outfit.categories) ? outfit.categories : START_CATS;
  return {
    slots, categories: [...new Set([...categories.filter(c=>LOOK_CATS.includes(c)), ...Object.keys(slots)])],
    pins: (Array.isArray(outfit.pins) ? outfit.pins : []).filter(c=>slots[c]),
    occ: outfit.occ, name: outfit.name, id: outfit.id
  };
}

async function saveLook() {
  if (Object.values(dr.slots).filter(id=>it(id)).length < 2) return toast('Pick at least 2 pieces.');
  const draft = dr;
  const current = D.outfits.find(o=>o.id===draft.id);
  const outfit = {
    id: current?.id ?? nextLocalId(D.outfits), name: dr.name.trim() || tr('Untitled look'),
    occ: dr.occ, slots: {...dr.slots}, categories: [...dr.categories], pins: [...dr.pins],
    date: Date.now(), fav: current?.fav ?? false
  };
  const outfits = current ? D.outfits.map(o=>o.id===current.id ? outfit : o) : [...D.outfits, outfit];
  try {
    await kvSet('outfits', outfits);
  } catch {
    toast('Could not save data. Browser storage may be blocked.');
    return;
  }
  D.outfits = outfits;
  if (dr === draft) dr = newDraft();
  toast('Outfit saved!');
  if (page==='create') go('saved');
}

function nextLocalId(records) {
  return records.reduce((id, record)=>Math.max(id, Number(record.id)+1 || 0), Date.now());
}

let swipeStart;
let suppressCarouselClickUntil = 0;
document.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.pointerType !== 'touch') return;
  const row = event.target.closest('[data-look-row]');
  if (row) swipeStart = {id:event.pointerId, x:event.clientX, y:event.clientY, category:row.dataset.lookRow};
});
document.addEventListener('pointercancel', event => {
  if (swipeStart?.id === event.pointerId) swipeStart = undefined;
});

function refreshListArrows(frame, measure = false) {
  const list = frame.querySelector('.scroll-list');
  const arrows = frame.querySelectorAll('.list-arrow');
  if (measure) {
    const position = list.scrollLeft;
    frame.dataset.overflow = 'false';
    frame.dataset.overflow = String(list.scrollWidth - list.clientWidth >= 2);
    if (frame.dataset.overflow === 'true') list.scrollLeft = position;
  }
  arrows[0].setAttribute('aria-disabled', list.scrollLeft < 2);
  arrows[1].setAttribute('aria-disabled', list.scrollWidth - list.clientWidth - list.scrollLeft < 2);
}

function addListArrows(root) {
  for (const list of root.querySelectorAll('.chips, .look-picker-items')) {
    if (list.classList.contains('scroll-list')) continue;
    const frame = document.createElement('div');
    frame.className = 'scroll-frame';
    frame.dataset.overflow = 'false';
    const arrow = (direction, label, symbol) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'list-arrow';
      button.textContent = symbol;
      button.setAttribute('aria-label', tr(label));
      button.addEventListener('click', () => {
        if (button.getAttribute('aria-disabled') === 'true') return;
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        list.scrollBy({left:direction * Math.max(70, list.clientWidth * 0.8), behavior:reduced?'instant':'smooth'});
      });
      return button;
    };
    list.classList.add('scroll-list');
    list.before(frame);
    frame.append(arrow(-1,'Scroll back','‹'), list, arrow(1,'Scroll forward','›'));
    refreshListArrows(frame, true);
    const active = list.querySelector('.chip.on, [aria-pressed=true]');
    if (active) list.scrollLeft = Math.max(0, active.getBoundingClientRect().right - list.getBoundingClientRect().right + 4);
    refreshListArrows(frame);
    list.addEventListener('scroll', () => refreshListArrows(frame), {passive:true});
  }
}

function measureListArrows() {
  document.querySelectorAll('.scroll-frame').forEach(frame=>refreshListArrows(frame, true));
}

let photoLoad = 0;

async function fit(file, limit) {
  const url = URL.createObjectURL(file);
  try {
    const image = await loadImg(url);
    const scale = Math.min(1, limit / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#fff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return {
      url: canvas.toDataURL('image/jpeg', 0.85),
      blob: await new Promise((resolve, reject) => canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error('Image encoding failed'));
      }, 'image/jpeg', 0.85))
    };
  } finally { URL.revokeObjectURL(url); }
}

async function proc(file) {
  if (!file) return;
  const load = ++photoLoad;
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return toast('Please choose a JPG, PNG or WebP image.');
  if (file.size > 10e6) return toast('Image is too large (max 10 MB).');
  try {
    const photo = await fit(file, 1024);
    if (load !== photoLoad || page !== 'add') return;
    A = {orig:photo.url, ob:photo.blob, view:'orig', cat:pendingLookUpload || 'Tops'};
    render();
  } catch {
    if (load === photoLoad) toast('Please choose a JPG, PNG or WebP image.');
  }
}

 }else if(i==='o_occ'){dr.occ=e.target.value}else if(i=='fcol'){F.col=e.target.value;drawW()}else if(i=='fsea'){F.sea=e.target.value;drawW()}else if(i=='tilt'){const photo=A,angle=+e.target.value;A.tv=angle;tilt(A.base||A.cut,angle).then(u=>{if(A===photo&&A.tv===angle){A.cut=u;render()}}).catch(()=>toast('Background removal failed. Check your internet connection and try again, or choose another photo.'))}else if(i=='fcam'||i=='fup'){proc(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown', event => {
 if(event.key==='Escape'&&$('#sheet').classList.contains('on')){sheet();return;}
 if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight')return;
 const piece=event.target.closest('.look-carousel .look-piece');
 if(!piece)return;
 event.preventDefault();
 cycleLook(piece.dataset.c,event.key==='ArrowLeft'?-1:1);
});
